[package]
name = "rust_lib_my_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0"
flutter_rust_bridge = "=2.13.0"
veilid-taxi = { path = "../../../veilid-taxi" }
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = "1.54"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
